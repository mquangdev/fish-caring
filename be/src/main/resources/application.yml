spring:
  application:
    name: fish-caring-be
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fishcaring}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
