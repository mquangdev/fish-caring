services:
  mysql:
    image: mysql:8.0
    container_name: fish-selling-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: fish_selling
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - fish_selling_data:/var/lib/mysql

volumes:
  fish_selling_data: